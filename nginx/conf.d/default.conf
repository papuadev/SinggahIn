# ==============================================================================
# Nginx Configuration for SinggahIn (Production & Staging Multi-Domain)
# ==============================================================================

# 1. HTTP Server Block (Port 80)
# Melayani ACME Challenge Certbot dan redirect otomatis seluruh trafik ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name singgahin.biz.id www.singgahin.biz.id stage.singgahin.biz.id;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect otomatis HTTP ke HTTPS secara permanen (301)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block (Port 443) - PRODUCTION (singgahin.biz.id)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name singgahin.biz.id www.singgahin.biz.id;

    # Docker embedded DNS resolver (dynamically resolves upstream without crashing on boot)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Sertifikat SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/singgahin.biz.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/singgahin.biz.id/privkey.pem;

    # Protokol & Cipher Suite SSL yang Aman
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Batas ukuran payload upload media (10MB)
    client_max_body_size 10M;

    # Kompresi Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Production API Backend Reverse Proxy (Express.js on port 5000)
    location /api/ {
        set $prod_backend http://backend-prod:5000;
        proxy_pass $prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Production Frontend Single Page Application (React on port 80)
    location / {
        set $prod_frontend http://frontend-prod:80;
        proxy_pass $prod_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 3. HTTPS Server Block (Port 443) - STAGING (stage.singgahin.biz.id)
