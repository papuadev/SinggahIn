name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment and Tags
        run: |
          echo "REGISTRY_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=stage" >> $GITHUB_ENV
            echo "IMAGE_TAG=stage" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/singgahin-backend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/singgahin-backend:${{ env.IMAGE_TAG }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/singgahin-frontend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/singgahin-frontend:${{ env.IMAGE_TAG }}-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || '/api/v1' }}
            VITE_MIDTRANS_CLIENT_KEY=${{ secrets.VITE_MIDTRANS_CLIENT_KEY }}
            VITE_OPENCAGE_API_KEY=${{ secrets.VITE_OPENCAGE_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Target Services
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TARGET_BACKEND=backend-prod" >> $GITHUB_ENV
            echo "TARGET_FRONTEND=frontend-prod" >> $GITHUB_ENV
            echo "TARGET_DB=singgahin_db" >> $GITHUB_ENV
          else
            echo "TARGET_BACKEND=backend-stage" >> $GITHUB_ENV
            echo "TARGET_FRONTEND=frontend-stage" >> $GITHUB_ENV
            echo "TARGET_DB=singgahin_stage" >> $GITHUB_ENV
          fi

      - name: Copy Deployment Configs to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,nginx/conf.d/default.conf"
          target: ${{ secrets.TARGET_DIR }}

      - name: Run Deployment Commands on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_BACKEND: ${{ env.TARGET_BACKEND }}
          TARGET_FRONTEND: ${{ env.TARGET_FRONTEND }}
          TARGET_DB: ${{ env.TARGET_DB }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: TARGET_BACKEND,TARGET_FRONTEND,TARGET_DB
          script: |
            set -e
            cd ${{ secrets.TARGET_DIR }}

            # Ensure support directories exist
            mkdir -p nginx/ssl certbot/conf certbot/www

            # Log in to GHCR on VPS
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Ensure PostgreSQL container is running
            docker compose -f docker-compose.prod.yml up -d postgres

            # Auto-create database in PostgreSQL if it does not exist yet
            docker compose -f docker-compose.prod.yml exec -T postgres psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$TARGET_DB'" | grep -q 1 || \
            docker compose -f docker-compose.prod.yml exec -T postgres psql -U postgres -c "CREATE DATABASE $TARGET_DB;"

            # Pull updated images for target environment
            docker compose -f docker-compose.prod.yml pull $TARGET_BACKEND $TARGET_FRONTEND

            # Re-create and restart target environment containers without affecting the other environment
            docker compose -f docker-compose.prod.yml up -d --no-deps $TARGET_BACKEND $TARGET_FRONTEND
            docker compose -f docker-compose.prod.yml up -d nginx-proxy

            # Apply pending database schema changes for this specific environment
            docker compose -f docker-compose.prod.yml exec -T $TARGET_BACKEND npx prisma db push

            # Clean up old unused Docker images to save VPS storage
            docker image prune -af
